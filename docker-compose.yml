services:
  mysql:
    image: mysql:8.0
    container_name: speakup-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootpass}"
      MYSQL_DATABASE: "${DB_DATABASE:-db_speakup}"
      MYSQL_USER: "${DB_USERNAME:-speakup}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-speakup123}"
    volumes:
      - speakup_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD:-rootpass}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dokploy-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speakup-backend
    restart: unless-stopped
    expose:
      - "80"
    environment:
      APP_NAME: "SpeakUp"
      APP_KEY: "${APP_KEY}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-https://api.speakup.web.id}"
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: en
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-db_speakup}"
      DB_USERNAME: "${DB_USERNAME:-speakup}"
      DB_PASSWORD: "${DB_PASSWORD:-speakup123}"
      CACHE_STORE: database
      SESSION_DRIVER: database
      SESSION_LIFETIME: "120"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-.speakup.web.id}"
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-speakup.web.id,www.speakup.web.id}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://speakup.web.id,https://www.speakup.web.id}"
      BCRYPT_ROUNDS: "12"
      MAIL_MAILER: "${MAIL_MAILER:-log}"
      MAIL_HOST: "${MAIL_HOST:-smtp.mailtrap.io}"
      MAIL_PORT: "${MAIL_PORT:-2525}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@speakup.web.id}"
      MAIL_FROM_NAME: SpeakUp
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.speakup-backend.rule=Host(`${BACKEND_HOST:-api.speakup.web.id}`)"
      - "traefik.http.routers.speakup-backend.entrypoints=web,websecure"
      - "traefik.http.routers.speakup-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.speakup-backend.loadbalancer.server.port=80"
      - "traefik.docker.network=dokploy-network"

volumes:
  speakup_mysql_data:
  backend_storage:

networks:
  dokploy-network:
    external: true
